# Isolated workbench routes. Existing CPO routes remain unchanged.
location = /shoe { return 308 /shoe/; }
location ^~ /shoe/ {
    proxy_pass http://127.0.0.1:18808;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control no-store;
}
location = /shoe-api/auth/login {
    limit_req zone=cpo_login burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:18808/auth/login;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 16k;
}
location ^~ /shoe-api/ {
    proxy_pass http://127.0.0.1:18808/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 11m;
    add_header Cache-Control no-store;
}
